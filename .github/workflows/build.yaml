name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    outputs:
      gems: ${{steps.select_component.outputs.components}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/select_component
        name: Select Components
        id: select_component
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

  build:
    name: Package / ${{ matrix.packages }}
    runs-on: ubuntu-24.04
    needs: analyze
    strategy:
      matrix:
        packages: ${{ fromJson(needs.analyze.outputs.Components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "npm"

      - run: npm ci --ignore-scripts
        working-directory: packages/${{ matrix.packages }}

      - run: npm run build
        working-directory: packages/${{ matrix.packages }}

      # note if locally preparing packages you will need to explicitly set the version in package.json.
      - run: npm pack
        working-directory: packages/${{ matrix.packages }}

  verify:
    runs-on: ubuntu-24.04
    needs:
      - analyze
      - build
    if: ${{ always() }} # Always run so we can detect failures/skips
    steps:
      - name: Count builds
        run: |
          if [ "${{ needs.analyze.outputs.gems }}" = "[]" ]; then
            echo "::error:: ❌ No gems selected — build matrix was empty."
            exit 1
          fi
          gems='${{ needs.analyze.outputs.gems }}'
          count=$(echo "$gems" | jq 'length')
          echo "ℹ️ Build count: $count"

      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" = "skipped" ]; then
            echo "::error:: Build job was skipped — no builds executed."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error:: ❌ One or more builds failed."
            exit 1
          fi
          echo "::notice:: ✅ All builds ran and passed."
