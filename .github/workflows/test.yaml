name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{steps.select_gem.outputs.components}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/select_component
        name: Select Components
        id: select_component
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          deny: "ci"

  build:
    name: Package / ${{ matrix.packages }} [Node ${{ matrix.node-version }}]
    runs-on: ubuntu-24.04
    needs: analyze
    strategy:
      matrix:
        node-version: [14.x, 18.x, 20.x, 22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        packages: ${{ fromJson(needs.analyze.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci --ignore-scripts
        working-directory: packages/${{ matrix.packages }}

      - run: npm test
        working-directory: packages/${{ matrix.packages }}

  verify:
    runs-on: ubuntu-24.04
    needs:
      - analyze
      - build
    if: ${{ always() }} # Always run so we can detect failures/skips
    steps:
      - name: Count builds
        run: |
          if [ "${{ needs.analyze.outputs.components }}" = "[]" ]; then
            echo "::error:: ❌ No gems selected — build matrix was empty."
            exit 1
          fi
          gems='${{ needs.analyze.outputs.gems }}'
          count=$(echo "$gems" | jq 'length')
          echo "ℹ️ Build count: $count"

      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" = "skipped" ]; then
            echo "::error:: Build job was skipped — no builds executed."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error:: ❌ One or more builds failed."
            exit 1
          fi
          echo "::notice:: ✅ All builds ran and passed."
